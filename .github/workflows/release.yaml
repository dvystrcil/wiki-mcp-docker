# Release pipeline for wiki-mcp.
#
# Triggered by a published GitHub release. Retags the existing `:dev`
# image (built by build.yaml on push to main) as the release semver,
# matching the open-terminal pattern. Single-arch (linux/amd64) so we
# use `docker buildx imagetools create` to retag — no manifest dance.
#
# This is the homelab semver convention: deploys pin the semver tag
# in the deploy repo, no ImageUpdater needed. Bumps are manual via
# GitHub releases — release === intentional deploy candidate.

name: release

on:
  release:
    types: [published]

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: ai
  IMAGE_NAME: wiki-mcp

jobs:
  promote:
    runs-on: wiki-mcp-docker-runner
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Log in to Harbor (internal)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ env.HB_USERNAME }}
          password: ${{ env.HB_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor-core.harbor.svc.cluster.local"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Extract semver metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Retag the existing :dev → semver + major.minor + latest, no rebuild.
      # `buildx imagetools create -t` copies the manifest under a new tag
      # without pulling/pushing layers. Single-arch, so this is just a
      # tag-pointer copy.
      - name: Promote dev image to release tags
        run: |
          SRC=${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:dev
          for TAG in $(jq -cr '[.tags[]] | unique | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            echo "→ retagging $SRC as $TAG"
            docker buildx imagetools create -t "$TAG" "$SRC"
          done

      - name: Inspect promoted image
        run: |
          docker buildx imagetools inspect \
            ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Summary
        run: |
          {
            echo "Released: \`${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "Pin in dvystrcil/wiki-mcp:base/deployment.yaml:"
            echo ""
            echo "    image: harbor.sirddail.net/ai/wiki-mcp:${{ steps.meta.outputs.version }}"
          } >> $GITHUB_STEP_SUMMARY

  # homelab#2320: merge = release = deploy. After promote (the tag must exist
  # in Harbor), release-action's deploy step moves the newTag of
  # harbor.sirddail.net/ai/wiki-mcp in dvystrcil/wiki-mcp: newTag lines only, every
  # kustomize root rendered before/after (image-only diff), never a
  # downgrade, a major goes to a PR, retried if main moves.
  #
  # Kill switch: repo variable AUTO_DEPLOY. `false` opens one PR
  # (deploy/wiki-mcp-<ver>) instead of committing; committing to main needs the
  # CICD App as a bypass actor on wiki-mcp's ruleset.
  deploy:
    needs: promote
    runs-on: wiki-mcp-docker-runner
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a pending newer release replaces an older pending
    # one. An older release that loses a race finds main past it (noop).
    concurrency:
      group: deploy-dvystrcil/wiki-mcp
      cancel-in-progress: false
    steps:
      # One named secret per step, never the whole store.
      - name: Fetch CICD_APP_CLIENT_ID from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_CLIENT_ID
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch CICD_APP_PRIVATE_KEY from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_PRIVATE_KEY
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Generate app token
        # The CICD GitHub App, scoped to the repo it writes.
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
          client-id: ${{ env.CICD_APP_CLIENT_ID }}
          private-key: ${{ env.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wiki-mcp

      - name: Deploy to wiki-mcp
        id: deploy
        uses: dvystrcil/release-action@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          create-release: false
          version: ${{ github.event.release.tag_name }}
          deploy-repo: dvystrcil/wiki-mcp
          deploy-images: harbor.sirddail.net/ai/wiki-mcp
          auto-deploy: ${{ vars.AUTO_DEPLOY }}

      - run: echo "deploy-result=${{ steps.deploy.outputs.deploy-result }}"
